[project]
name = "fitstack-backend"
version = "0.3.0"
description = "FitStack backend — FastAPI service that aggregates fitness data from Garmin (and later Strava)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.4",
    "pydantic-settings>=2.5",
    "garminconnect>=0.3.7",
    "curl_cffi>=0.15.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
    "httpx",  # for FastAPI TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
